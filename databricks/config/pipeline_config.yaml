environment: "prod"
azure:
  subscription_id: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
  resource_group: "rg-eyerecommend-prod-eastus2"
  key_vault_name: "kv-eyerecommend-prod-01"
  storage_account_name: "steyerecommendproddls01"
  log_analytics_workspace_id: "law-eyerecommend-prod"

storage:
  containers:
    landing: "abfss://landing@steyerecommendproddls01.dfs.core.windows.net"
    bronze: "abfss://bronze@steyerecommendproddls01.dfs.core.windows.net"
    silver: "abfss://silver@steyerecommendproddls01.dfs.core.windows.net"
    gold: "abfss://gold@steyerecommendproddls01.dfs.core.windows.net"
    quarantine: "abfss://quarantine@steyerecommendproddls01.dfs.core.windows.net"

postgres_target:
  host: "psql-eyerecommend-prod.postgres.database.azure.com"
  port: 5432
  database: "eyerecommend_central_db"
  ssl_mode: "require"
  batch_size: 5000
  max_connections: 30

spark_optimizations:
  adaptive_query_execution: true
  coalesce_partitions: true
  default_shuffle_partitions: 200
  broadcast_join_threshold_bytes: 10485760 # 10MB
  delta_auto_optimize: true
  delta_auto_compact: true

data_quality_thresholds:
  max_rejection_percentage: 0.05 # 0.05%
  reconciliation_variance_threshold: 0.0001 # 0.01%
  strict_hipaa_compliance: true
